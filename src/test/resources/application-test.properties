# Use a separate schema and credentials; never fall back to MYSQL_USERNAME/PASSWORD.
spring.config.import=optional:file:.env.test[.properties]

# Provision the schema first with a user that has access only to this schema.
spring.datasource.url=jdbc:mysql://${TEST_MYSQL_HOST:localhost}:${TEST_MYSQL_PORT:3306}/mysql_univcabi_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${TEST_MYSQL_USERNAME}
spring.datasource.password=${TEST_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep real MySQL for future @DataJpaTest tests as well.
spring.test.database.replace=none

# Recreate tables on context startup and drop them on context shutdown.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Test fixtures must be supplied by tests, not development seed scripts.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Dummy values for tests loading the full application context.
jwt.secret=univcabi-test-only-secret-key-32-bytes
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=86400000

# Full-context tests still load the project's Redis and Kafka components.
spring.data.redis.host=${TEST_REDIS_HOST:localhost}
spring.data.redis.port=${TEST_REDIS_PORT:6379}
spring.data.redis.database=15
spring.kafka.bootstrap-servers=${TEST_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.bootstrap-servers-optional=true

logging.level.org.hibernate.orm.jdbc.bind=TRACE